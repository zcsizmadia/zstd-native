name: Miri

# Miri on zstd-native's unit tests and doc examples, little endian and big
# endian. With the `portable` feature: Miri cannot run the asm! loops or
# the BMI2/SSE2 #[target_feature] paths, so only the generic code (and its
# unsafe: the bit reader and writer, Huffman and FSE tables, sequence
# execution, match finders) runs.
#
# Every test is sized for Miri (a few KiB of input, fewer cases: see
# `MIRI` in enc/fast.rs and the other test modules), to a few minutes at
# most there. Pushes and pull requests run one job per target and skip the
# slowest tests (listed below, a minute or more each). The weekly and
# manual runs take every test, split into four jobs per target (nextest's
# hash partitions; the doc examples run in the first). A test is reported
# SLOW after 5 minutes and killed after 10 (.config/nextest.toml).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  # Runs of the same PR share a group, and so do pushes to main: a newer
  # push cancels the older run. Scheduled and manual runs get their own
  # group, so a push never cancels them.
  group: miri-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Every test on the weekly and manual runs, the fast ones otherwise.
  FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  miri:
    # (pushes and PRs: partition 0, no suffix)
    name: miri ${{ matrix.target }}${{ matrix.partition && format(' {0}/4', matrix.partition) || '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # Little endian and big endian.
        target: [x86_64-unknown-linux-gnu, s390x-unknown-linux-gnu]
        # The weekly and manual runs: partitions 1 to 4 of every test.
        # Pushes and PRs: 0, one job with the fast tests.
        partition: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[1, 2, 3, 4]' || '[0]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: miri-${{ matrix.target }}
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest
      - run: cargo miri setup --target ${{ matrix.target }}
      - name: Unit tests
        # nextest runs each test in its own Miri process, one per CPU.
        shell: bash
        run: |
          partition=()
          if [ "$FULL" = true ]; then
            filter='all()'
            partition=(--partition "hash:${{ matrix.partition }}/4")
          else
            filter='not (test(=enc::cdict::tests::round_trip_every_mode)
              | test(=enc::dfast::tests::roundtrip_ring_variants)
              | test(=enc::fast::tests::roundtrip_levels)
              | test(=enc::fast::tests::roundtrip_ring_variants)
              | test(=enc::fse_enc::tests::normalize_write_read_round_trip)
              | test(=enc::hist::tests::matches_reference)
              | test(=enc::huf_enc::tests::compress_repeat_round_trip)
              | test(=enc::huf_enc::tests::small_outputs)
              | test(=enc::huf_enc::tests::write_read_and_decode_round_trip)
              | test(=enc::lazy::tests::roundtrip_all_variants)
              | test(=enc::lazy::tests::roundtrip_ring_variants)
              | test(=enc::lazy::tests::small_blocks)
              | test(=enc::lazy::tests::stale_tags)
              | test(=enc::ldm::tests::round_trip_forced)
              | test(=enc::opt::tests::incremental_prices_match_libzstd)
              | test(=enc::opt::tests::long_matches)
              | test(=enc::opt::tests::roundtrip_all_variants)
              | test(=enc::opt::tests::roundtrip_levels)
              | test(=enc::opt::tests::roundtrip_ring_variants)
              | test(=enc::opt::tests::small_blocks)
              | test(=enc::presplit::tests::optimal_size)
              | test(=enc::presplit::tests::split_points_are_valid)
              | test(=enc::presplit::tests::split_points_match_libzstd)
              | test(=stream::tests::direct_and_buffered_agree))'
          fi
          filter=$(echo "$filter" | tr -s '\n ' '  ')
          cargo miri nextest run -p zstd-native --lib --features portable \
            --target ${{ matrix.target }} --no-fail-fast -E "$filter" "${partition[@]}"
      - name: Doc examples
        if: matrix.partition <= 1
        shell: bash
        # The set_workers example compresses 2.4 MB with four threads.
        run: |
          skip=()
          [ "$FULL" = true ] || skip=(--skip set_workers)
          cargo miri test -p zstd-native --doc --features portable \
            --target ${{ matrix.target }} -- "${skip[@]}"
