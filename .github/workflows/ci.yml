name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p zstd-native --no-default-features -- -D warnings
      - run: cargo clippy -p zstd-native --all-targets --features portable -- -D warnings
      - run: cargo doc -p zstd-native --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-26.04 }
          - { name: linux-arm64, os: ubuntu-26.04-arm }
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
      - name: Test (CPU-specific paths selected at run time)
        run: cargo test --workspace --profile ci
      - name: Test (portable fallbacks)
        run: cargo test -p zstd-bench --profile ci --features zstd-native/portable
      - name: Test (no_std unit tests)
        run: cargo test -p zstd-native --profile ci --no-default-features --lib
      - name: Corruption (longer run)
        run: cargo test -p zstd-bench --profile ci --test corruption
        env:
          ZSTD_NATIVE_CORRUPTION_ITERS: "200000"
      - name: Test (32-bit)
        if: matrix.name == 'windows-x64'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo test --workspace --profile ci --target i686-pc-windows-msvc

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - run: cargo build -p zstd-native
