[package]
name = "zstd-native"
description = "Fastest pure Rust Zstandard (zstd) compression and decompression: byte-identical with libzstd 1.5.7 and faster than C. No C code, no_std."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["zstd", "zstandard", "compression", "decompression"]
categories = ["compression", "no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
## std::io types and run-time CPU feature detection; without it the crate
## is no_std + alloc (CPU features then come from compile-time target
## features).
std = []
## Disables the SIMD/BMI2 specializations so only the generic code runs.
## For testing the fallbacks: it changes speed, never results.
portable = []

[lints]
workspace = true
